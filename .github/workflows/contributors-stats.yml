name: Update Contributors Stats

on:
  push:
    branches:
      - main
      - feature/main-menu
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Update README with contributor percentages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import re
          import urllib.request

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/contributors?per_page=100"

          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "GitHub-Actions-Contributors-Stats",
              },
          )

          with urllib.request.urlopen(req, timeout=20) as resp:
              data = json.loads(resp.read().decode("utf-8"))

          if not isinstance(data, list) or not data:
              raise SystemExit("No contributors returned by GitHub API")

          total = sum(int(item.get("contributions", 0)) for item in data)
          if total <= 0:
              raise SystemExit("Total contributions is 0")

          labels = {
              "S1dorok": "Vladimir Sidorov (`S1dorok`)",
              "6apa": "Бара (`6apa`)",
          }

          lines = []
          for item in data:
              login = item.get("login", "unknown")
              commits = int(item.get("contributions", 0))
              pct = (commits / total) * 100.0
              name = labels.get(login, f"`{login}`")
              lines.append(f"- {name} — **{pct:.1f}%** ({commits} коммитов)")

          block = "\n".join(lines)

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          pattern = re.compile(
              r"(<!-- CONTRIBUTORS_STATS:START -->\s*).*?(\s*<!-- CONTRIBUTORS_STATS:END -->)",
              re.DOTALL,
          )
          if not pattern.search(readme):
              raise SystemExit("Markers CONTRIBUTORS_STATS:START/END not found in README.md")

          updated = pattern.sub(rf"\g<1>{block}\g<2>", readme, count=1)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(updated)
          EOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "No changes in README.md"
            exit 0
          fi
          git add README.md
          git commit -m "docs: update contributors percentage stats"
          git push
